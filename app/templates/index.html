<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceAge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="container">

    <header class="topbar">
      <h1>FaceAge</h1>
      <div class="language-switch" role="group" aria-label="Taal / Language">
        <button type="button" id="lang-nl" class="lang-btn active">Nederlands</button>
        <span aria-hidden="true">|</span>
        <button type="button" id="lang-en" class="lang-btn">English</button>
      </div>
    </header>

    <section id="view-camera" class="view">
      <p class="lead" data-i18n="welcome"></p>
      <p data-i18n="instructions"></p>
      <div class="video-frame">
        <div class="mirror-top" aria-hidden="true"></div>
        <div class="corner-tl" aria-hidden="true"></div>
        <div class="corner-tr" aria-hidden="true"></div>
        <div class="corner-bl" aria-hidden="true"></div>
        <div class="corner-br" aria-hidden="true"></div>
        <video id="webcam" autoplay playsinline muted></video>
      </div>
      <button type="button" id="capture-btn" class="primary-btn" data-i18n="capture" disabled></button>
    </section>

    <section id="view-loading" class="view" hidden>
      <div class="magic-animation" aria-hidden="true">
        <div class="sparkle sparkle-1"></div>
        <div class="sparkle sparkle-2"></div>
        <div class="sparkle sparkle-3"></div>
        <div class="sparkle sparkle-4"></div>
        <div class="sparkle sparkle-5"></div>
        <div class="sparkle sparkle-6"></div>
        <div class="magic-circle"></div>
        <div class="magic-orbs">
          <div class="orb orb-1"></div>
          <div class="orb orb-2"></div>
          <div class="orb orb-3"></div>
        </div>
      </div>
      <p class="lead" data-i18n="loading" role="status"></p>
    </section>

    <section id="view-result" class="view" hidden>
      <p class="result" id="result-text" role="status"></p>
      <p data-i18n="result_explanation"></p>
      <p class="reset-note" data-i18n="reset_note"></p>
      <button type="button" id="retry-btn" class="primary-btn" data-i18n="retry"></button>
    </section>

    <section id="view-error" class="view" hidden>
      <p class="error" id="error-text" role="alert"></p>
      <p class="reset-note" data-i18n="reset_note"></p>
      <button type="button" id="error-retry-btn" class="primary-btn" data-i18n="retry"></button>
    </section>

    <footer class="footer">
      <p data-i18n="privacy"></p>
      <p data-i18n="research_notice"></p>
    </footer>

  </main>

  <!-- the photo only lives in this in-memory canvas, it is never saved -->
  <canvas id="snapshot" hidden></canvas>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
