name: Build Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile.serve"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serve
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/maastrichtu-cds/faceage-weekend-van-de-wetenschap:serve
            ghcr.io/maastrichtu-cds/faceage-weekend-van-de-wetenschap:latest
            ghcr.io/maastrichtu-cds/faceage-weekend-van-de-wetenschap:sha-${{ github.sha }}
