# Simple yearly start command for the FaceAge science fair booth:
#
#   docker compose up
#
# Open http://localhost:8000 on the booth laptop.
services:
  faceage:
    build:
      context: .
      dockerfile: Dockerfile.serve
    image: faceage:serve
    # TensorFlow 2.6 only ships x86_64 Linux wheels; on Apple Silicon Macs this
    # runs under Rosetta emulation (Docker Desktop default)
    platform: linux/amd64
    container_name: faceage-beurs
    ports:
      - "8000:8000"
    volumes:
      # the model is mounted read-only; photos are never stored
      - ./models:/models:ro
    restart: unless-stopped
